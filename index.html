<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSCアクセス・プロ 支援ポータルサイト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #3d5a80;
  --primary-light: #5b7ea8;
  --primary-bg: #f0f4f8;
  --accent: #3d5a80;
  --accent-hover: #2c4a6e;
  --danger: #b33a3a;
  --bg: #f7f8fa;
  --card-bg: #fff;
  --text: #2d3748;
  --text-light: #5a6577;
  --text-muted: #8e99a8;
  --border: #e2e6ec;
  --radius: 6px;
  --radius-lg: 8px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
  --shadow-md: 0 2px 6px rgba(0,0,0,.07);
  --shadow-lg: 0 4px 12px rgba(0,0,0,.08);
  --transition: .2s ease;
}
[data-theme="dark"] {
  --bg: #1a1f2e;
  --card-bg: #232a3b;
  --text: #d8dce4;
  --text-light: #a0a8b8;
  --text-muted: #6b7385;
  --border: #333b4f;
  --primary-bg: #2a3348;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.2);
  --shadow-md: 0 2px 6px rgba(0,0,0,.25);
  --shadow-lg: 0 4px 12px rgba(0,0,0,.3);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.8;
  -webkit-text-size-adjust: 100%;
}

/* ===== HEADER ===== */
.top-bar {
  background: rgba(255,255,255,.95);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  padding: .5rem .8rem;
  display: flex;
  align-items: center;
  gap: .5rem;
  position: sticky;
  top: 0;
  z-index: 100;
  height: 52px;
}
[data-theme="dark"] .top-bar { background: rgba(22,33,62,.95); }
.hamburger {
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem; color: var(--text-light);
  cursor: pointer; border-radius: var(--radius);
  transition: background var(--transition);
  border: none; background: none;
  -webkit-tap-highlight-color: transparent;
}
.hamburger:hover { background: var(--primary-bg); }
.site-logo {
  display: flex; align-items: center; gap: .4rem;
  text-decoration: none; color: var(--text);
}
.site-logo .logo-mark {
  width: 28px; height: 28px;
  background: var(--primary);
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: .65rem;
}
.site-logo .logo-text { font-size: .85rem; font-weight: 600; }
.header-spacer { flex: 1; }
.header-actions { display: flex; align-items: center; gap: .3rem; }
.header-search {
  display: flex; align-items: center;
  background: var(--primary-bg); border-radius: 20px;
  padding: .25rem .7rem; gap: .3rem;
  flex: 1; max-width: 240px;
}
.header-search input {
  border: none; background: none; outline: none;
  font-size: .8rem; width: 100%; font-family: inherit;
  color: var(--text);
}
.header-search .search-icon { color: var(--text-muted); font-size: .85rem; }
.icon-btn {
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%; border: none; background: none;
  cursor: pointer; font-size: 1rem; color: var(--text-light);
  transition: background var(--transition);
  -webkit-tap-highlight-color: transparent;
}
.icon-btn:hover { background: var(--primary-bg); }
.icon-btn.fav-active { color: var(--primary); }

/* ===== SEARCH RESULTS ===== */
.search-results {
  display: none; position: fixed; top: 52px; left: 0; right: 0;
  background: var(--card-bg);
  border-bottom: 2px solid var(--primary-light);
  box-shadow: var(--shadow-lg);
  max-height: 70vh; overflow-y: auto; z-index: 150; padding: .4rem 0;
}
.search-results.open { display: block; }
.search-result-item {
  display: flex; align-items: center; gap: .7rem;
  padding: .6rem 1rem; cursor: pointer;
  transition: background var(--transition);
  border-bottom: 1px solid var(--border);
  text-decoration: none; color: var(--text);
}
.search-result-item:hover { background: var(--primary-bg); }
.search-result-item .sr-icon { font-size: 1.1rem; flex-shrink: 0; }
.search-result-item .sr-title { font-size: .85rem; font-weight: 600; }
.search-result-item .sr-path { font-size: .68rem; color: var(--text-muted); }
.search-result-item .sr-snippet { font-size: .72rem; color: var(--text-light); margin-top: .1rem; }
.search-result-item .sr-snippet mark { background: #fff3b0; color: #333; padding: 0 .1rem; border-radius: 2px; }
.search-no-result { padding: 1rem; text-align: center; font-size: .82rem; color: var(--text-muted); }

/* ===== SIDEBAR ===== */
.sidebar-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.4); z-index: 200;
}
.sidebar-overlay.open { display: block; }
.sidebar {
  position: fixed; top: 0; left: -300px;
  width: 300px; max-width: 85vw; height: 100%;
  background: var(--card-bg); z-index: 201;
  transition: left .3s cubic-bezier(.4,0,.2,1);
  overflow-y: auto;
  box-shadow: 4px 0 16px rgba(0,0,0,.15);
}
.sidebar.open { left: 0; }
.sidebar-header {
  padding: 1rem 1rem .7rem; font-weight: 700; font-size: .95rem;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.sidebar-close {
  cursor: pointer; font-size: 1.4rem; color: var(--text-muted);
  background: none; border: none; width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius);
}
.sidebar nav { padding: .3rem 0; }
.sidebar nav a {
  display: flex; align-items: center; gap: .5rem;
  padding: .55rem 1rem; text-decoration: none;
  color: var(--text); font-size: .82rem; font-weight: 400;
  transition: all var(--transition);
  border-left: 3px solid transparent;
}
.sidebar nav a:hover { background: var(--primary-bg); color: var(--primary); border-left-color: var(--primary-light); }
.sidebar nav a.active { background: var(--primary-bg); color: var(--primary); font-weight: 600; border-left-color: var(--primary); }
.sidebar nav a .nav-icon { font-size: 1rem; width: 1.3rem; text-align: center; }
.sidebar nav a.indent { padding-left: 2.6rem; font-size: .78rem; }
.sidebar nav .nav-divider { height: 1px; background: var(--border); margin: .4rem .8rem; }

/* ===== PAGE CONTAINER ===== */
.page-container { max-width: 1000px; margin: 0 auto; padding: 1.2rem .8rem 3rem; }

/* ===== HERO ===== */
.hero-section { text-align: center; padding: 2rem .8rem 1rem; }
.hero-badge {
  display: inline-block;
  background: var(--primary-bg); color: var(--primary);
  font-size: .65rem; font-weight: 600;
  padding: .2rem .7rem; border-radius: 4px;
  letter-spacing: .05em; margin-bottom: .6rem;
  border: 1px solid var(--border);
}
.hero-section h1 { font-size: clamp(1.2rem, 4vw, 1.8rem); font-weight: 700; color: var(--text); margin-bottom: .5rem; line-height: 1.4; }
.hero-section h1 .brand { color: var(--primary); }
.hero-desc { font-size: .82rem; color: var(--text-light); max-width: 520px; margin: 0 auto; line-height: 1.8; }

/* ===== QUICK STATS ===== */
.quick-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; margin: 1.2rem 0 1.5rem; }
.stat-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: .8rem .5rem; text-align: center; }
.stat-num { font-size: 1.4rem; font-weight: 700; color: var(--primary); line-height: 1.2; }
.stat-label { font-size: .68rem; color: var(--text-muted); margin-top: .15rem; }

/* ===== CATEGORY GRID ===== */
.category-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: .6rem; margin: 1rem 0 1.5rem; }
.cat-card {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 1rem .6rem; text-align: center;
  cursor: pointer; transition: all var(--transition);
  text-decoration: none; color: var(--text);
  -webkit-tap-highlight-color: transparent;
}
.cat-card:hover { border-color: var(--primary-light); background: var(--primary-bg); }
.cat-card .cat-icon { font-size: 1.8rem; display: block; margin-bottom: .3rem; }
.cat-card .cat-name { font-size: .78rem; font-weight: 600; line-height: 1.3; }
.cat-card .cat-count { font-size: .65rem; color: var(--text-muted); margin-top: .1rem; }

/* ===== SECTION HEADER ===== */
.section-header { display: flex; align-items: center; gap: .5rem; margin-bottom: .8rem; }
.section-header h2 { font-size: 1rem; font-weight: 700; }
.section-header .section-icon { font-size: 1.1rem; }

/* ===== CONTENT CARD ===== */
.content-card {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: var(--radius-lg); margin-bottom: 1rem; overflow: hidden;
}
.card-header { padding: 1rem 1rem .6rem; display: flex; align-items: flex-start; gap: .7rem; }
.card-header-icon {
  width: 36px; height: 36px; border-radius: var(--radius);
  background: var(--primary-bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem; flex-shrink: 0;
}
.card-header-text h3 { font-size: .98rem; font-weight: 700; line-height: 1.3; }
.card-header-text .card-meta { font-size: .7rem; color: var(--text-muted); margin-top: .1rem; }
.card-body { padding: 0 1rem 1rem; }
.card-body p { font-size: .84rem; color: var(--text-light); margin-bottom: .5rem; }
.card-body h3 { font-size: .95rem; font-weight: 700; margin: 1rem 0 .4rem; }

/* ===== ACTION BUTTONS ===== */
.action-btn {
  display: flex; align-items: center; justify-content: center; gap: .4rem;
  width: 100%; padding: .65rem 1rem; border-radius: var(--radius);
  font-size: .85rem; font-weight: 600; text-decoration: none;
  cursor: pointer; transition: all var(--transition);
  border: none; font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}
.action-btn-primary {
  background: var(--primary);
  color: #fff;
}
.action-btn-primary:hover { background: var(--accent-hover); }
.action-btn-outline {
  background: var(--card-bg); color: var(--text); border: 2px solid var(--border);
}
.action-btn-outline:hover { border-color: var(--primary-light); background: var(--primary-bg); }
.action-btn + .action-btn { margin-top: .4rem; }
.action-btn-sm {
  display: inline-flex; width: auto; padding: .4rem 1rem;
  font-size: .78rem; border-radius: 6px;
}

/* ===== INFO BOX ===== */
.info-box {
  background: var(--primary-bg); border-left: 4px solid var(--primary-light);
  border-radius: 0 var(--radius) var(--radius) 0;
  padding: .7rem .9rem; margin: .7rem 0; font-size: .82rem;
  color: var(--text-light); line-height: 1.8;
}
.info-box.warning { background: #fff3e0; border-left-color: #ff9800; }
.info-box.danger { background: #fde8e8; border-left-color: var(--danger); }
[data-theme="dark"] .info-box.warning { background: #2a2000; }
[data-theme="dark"] .info-box.danger { background: #2a0000; }

/* ===== PRODUCT GRID ===== */
.product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: .8rem; margin: .8rem 0; }
.product-card {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: var(--radius-lg); overflow: hidden;
  transition: all var(--transition); text-decoration: none; color: var(--text);
}
.product-card:hover { border-color: var(--primary-light); background: var(--primary-bg); }
.product-card .card-img {
  height: 100px; background: var(--primary-bg);
  display: flex; align-items: center; justify-content: center; font-size: 2.2rem;
}
.product-card .card-info { padding: .6rem .8rem; }
.product-card .card-info h3 { font-size: .85rem; font-weight: 700; margin-bottom: .1rem; }
.product-card .card-info .card-sub { font-size: .7rem; color: var(--text-muted); }
.product-card .card-badge {
  display: inline-block; background: var(--primary-bg); color: var(--primary);
  font-size: .6rem; font-weight: 600; padding: .1rem .4rem;
  border-radius: 10px; margin-top: .2rem;
}

/* ===== ARTICLE ===== */
.article-section {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: var(--radius-lg); margin-bottom: 1rem; overflow: hidden;
}
.article-header { padding: 1rem 1rem .6rem; border-bottom: 1px solid var(--border); }
.article-header h2 { font-size: 1.05rem; font-weight: 700; }
.article-header .article-meta { font-size: .7rem; color: var(--text-muted); margin-top: .15rem; }
.article-body { padding: 1rem; }
.article-body h3 {
  font-size: .95rem; font-weight: 700; margin: 1rem 0 .4rem;
  padding-bottom: .2rem; border-bottom: 2px solid var(--primary-bg);
}
.article-body h4 { font-size: .85rem; font-weight: 600; color: var(--text-light); margin: .7rem 0 .25rem; }
.article-body p, .article-body li { font-size: .82rem; color: var(--text-light); line-height: 1.8; }
.article-body ul, .article-body ol { padding-left: 1.3rem; margin: .2rem 0 .5rem; }
.article-body li { margin-bottom: .1rem; }
.article-body .highlight { color: var(--danger); font-weight: 600; }

/* ===== TABLE ===== */
.table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: .7rem 0; border-radius: var(--radius); border: 1px solid var(--border); }
.data-table { width: 100%; border-collapse: collapse; font-size: .78rem; min-width: 380px; }
.data-table th { background: var(--primary-bg); padding: .45rem .6rem; text-align: left; font-weight: 600; border-bottom: 2px solid var(--border); white-space: nowrap; }
.data-table td { padding: .4rem .6rem; border-bottom: 1px solid var(--border); }
.data-table tr:hover td { background: var(--primary-bg); }

/* ===== CHECKLIST ===== */
.checklist { list-style: none; padding-left: 0; }
.checklist li {
  position: relative; padding: .3rem 0 .3rem 1.5rem;
  font-size: .82rem; border-bottom: 1px solid var(--border);
}
.checklist li::before {
  content: ""; position: absolute; left: 0; top: .5rem;
  width: 13px; height: 13px; border: 2px solid var(--border);
  border-radius: 3px; background: var(--card-bg);
}

/* ===== BREADCRUMB ===== */
.breadcrumb { display: flex; align-items: center; gap: .25rem; font-size: .72rem; color: var(--text-muted); margin-bottom: .7rem; flex-wrap: wrap; }
.breadcrumb a { color: var(--primary); text-decoration: none; cursor: pointer; }
.breadcrumb a:hover { text-decoration: underline; }
.breadcrumb .sep { color: var(--border); }

/* ===== ANNOUNCEMENTS ===== */
.announce-list { margin: .4rem 0; }
.announce-item { display: flex; align-items: flex-start; gap: .6rem; padding: .55rem 0; border-bottom: 1px solid var(--border); }
.announce-date { font-size: .68rem; color: var(--text-muted); white-space: nowrap; min-width: 4.5rem; }
.announce-tag { font-size: .62rem; font-weight: 600; padding: .08rem .4rem; border-radius: 10px; white-space: nowrap; flex-shrink: 0; }
.announce-tag.new { background: #e8f0e8; color: #3a6b3a; }
.announce-tag.update { background: #e8eef5; color: #3d5a80; }
[data-theme="dark"] .announce-tag.new { background: #253025; }
[data-theme="dark"] .announce-tag.update { background: #252d38; }
.announce-text { font-size: .78rem; line-height: 1.4; }

/* ===== PHOTO GRID ===== */
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: .6rem; margin: .8rem 0; }
.photo-card {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden; text-align: center;
}
.photo-card .photo-placeholder {
  height: 100px; background: var(--primary-bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem; color: var(--text-muted);
}
.photo-card .photo-caption { padding: .4rem .5rem; font-size: .7rem; line-height: 1.4; color: var(--text-light); }

/* ===== CALENDAR ===== */
.calendar-placeholder {
  background: var(--primary-bg);
  border-radius: var(--radius); padding: 1.5rem .8rem; text-align: center;
}
.calendar-placeholder .cal-icon { font-size: 1.8rem; margin-bottom: .2rem; }
.calendar-placeholder p { font-size: .75rem; color: var(--text-muted); }

/* ===== TABS ===== */
.tab-content { display: none; }
.tab-content.active { display: block; animation: fadeIn .25s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ===== FAVORITES PANEL ===== */
.fav-panel {
  display: none; position: fixed; top: 52px; right: 0;
  width: 280px; max-width: 90vw; max-height: 70vh;
  background: var(--card-bg); border: 1px solid var(--border);
  box-shadow: var(--shadow-lg); z-index: 150;
  border-radius: 0 0 0 var(--radius-lg); overflow-y: auto;
}
.fav-panel.open { display: block; }
.fav-panel-header { padding: .7rem .9rem; font-weight: 700; font-size: .85rem; border-bottom: 1px solid var(--border); }
.fav-panel .fav-item {
  display: flex; align-items: center; gap: .5rem;
  padding: .5rem .9rem; cursor: pointer; font-size: .8rem;
  border-bottom: 1px solid var(--border); transition: background var(--transition);
}
.fav-panel .fav-item:hover { background: var(--primary-bg); }
.fav-panel .fav-item .fav-remove { margin-left: auto; color: var(--text-muted); font-size: .7rem; cursor: pointer; }
.fav-panel .fav-empty { padding: 1rem; text-align: center; font-size: .78rem; color: var(--text-muted); }

/* ===== BACK TO TOP ===== */
.back-to-top {
  position: fixed; bottom: 1.2rem; right: 1.2rem;
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--primary); color: #fff; font-size: 1rem;
  display: none; align-items: center; justify-content: center;
  cursor: pointer; box-shadow: var(--shadow-md); border: none; z-index: 90;
}
.back-to-top.visible { display: flex; }

/* ===== FOOTER ===== */
.site-footer {
  text-align: center; padding: 1.5rem .8rem;
  font-size: .7rem; color: var(--text-muted);
  border-top: 1px solid var(--border); background: var(--card-bg);
}
.site-footer .footer-links { margin-bottom: .4rem; }
.site-footer .footer-links a { color: var(--text-muted); text-decoration: none; margin: 0 .4rem; font-size: .7rem; }
.site-footer .footer-links a:hover { color: var(--primary); }

/* ===== DOWNLOAD BTN ===== */
.dl-btn-group { display: flex; flex-wrap: wrap; gap: .4rem; margin: .6rem 0; }
.dl-btn {
  display: inline-flex; align-items: center; gap: .3rem;
  padding: .35rem .8rem; border-radius: 6px;
  font-size: .75rem; font-weight: 600; text-decoration: none;
  border: 1px solid var(--border); background: var(--card-bg);
  color: var(--text); cursor: pointer; transition: all var(--transition);
}
.dl-btn:hover { border-color: var(--primary-light); background: var(--primary-bg); }

/* ===== VIDEO PLACEHOLDER ===== */
.video-placeholder {
  background: #f0f2f5; border: 1px solid var(--border);
  border-radius: var(--radius); padding: 2rem; text-align: center;
  margin: .7rem 0; color: var(--text-muted);
}
[data-theme="dark"] .video-placeholder { background: #1a1f2e; }
.video-placeholder .play-icon { font-size: 2.5rem; margin-bottom: .3rem; }
.video-placeholder p { font-size: .75rem; }

/* ===== RESPONSIVE ===== */
@media (min-width: 640px) {
  .page-container { padding: 1.5rem 1.2rem 3rem; }
  .header-search { max-width: 280px; }
}
@media (max-width: 639px) {
  .top-bar { padding: .4rem .5rem; gap: .3rem; }
  .site-logo .logo-text { display: none; }
  .hero-section { padding: 1.2rem .4rem .8rem; }
  .hero-section h1 { font-size: 1.1rem; }
  .quick-stats { gap: .4rem; }
  .stat-card { padding: .6rem .4rem; }
  .stat-num { font-size: 1.1rem; }
  .stat-label { font-size: .62rem; }
  .category-grid { grid-template-columns: repeat(3, 1fr); gap: .4rem; }
  .cat-card { padding: .7rem .4rem; border-radius: var(--radius); }
  .cat-card .cat-icon { font-size: 1.4rem; }
  .cat-card .cat-name { font-size: .68rem; }
  .product-grid { grid-template-columns: repeat(2, 1fr); gap: .5rem; }
  .product-card .card-img { height: 80px; font-size: 1.8rem; }
  .product-card .card-info { padding: .5rem .6rem; }
  .product-card .card-info h3 { font-size: .78rem; }
  .card-header { padding: .8rem; }
  .card-body { padding: 0 .8rem .8rem; }
  .article-header { padding: .8rem; }
  .article-body { padding: .8rem; }
  .content-card, .article-section { border-radius: var(--radius); }
  .announce-item { gap: .4rem; flex-wrap: wrap; }
  .photo-grid { grid-template-columns: repeat(2, 1fr); }
  .back-to-top { bottom: .8rem; right: .8rem; width: 36px; height: 36px; }
}
@media (max-width: 380px) {
  .category-grid { grid-template-columns: repeat(2, 1fr); }
  .product-grid { grid-template-columns: 1fr; }
  .photo-grid { grid-template-columns: repeat(2, 1fr); }
}

/* ===== PRINT ===== */
@media print {

/* ===== Sidebar ===== */
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('open');
  document.body.style.overflow = document.getElementById('sidebar').classList.contains('open') ? 'hidden' : '';
}

/* ===== Tab Navigation ===== */
function showTab(tabId) {
  document.querySelectorAll('.tab-content').forEach(function(t) { t.classList.remove('active'); });
  var target = document.getElementById('tab-' + tabId);
  if (target) target.classList.add('active');
  document.querySelectorAll('.sidebar nav a').forEach(function(a) { a.classList.toggle('active', a.dataset.tab === tabId); });
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
  document.body.style.overflow = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (history.pushState) history.replaceState(null, '', '#' + tabId);
}

/* ===== Back to Top ===== */
window.addEventListener('scroll', function() {
  document.getElementById('backToTop').classList.toggle('visible', window.scrollY > 300);
});

/* ===== Hash Navigation ===== */
function handleHash() {
  var hash = location.hash.replace('#', '');
  if (hash && document.getElementById('tab-' + hash)) showTab(hash);
}
window.addEventListener('hashchange', handleHash);
window.addEventListener('DOMContentLoaded', handleHash);

/* ===== Dark Mode ===== */
function toggleTheme() {
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', isDark ? '' : 'dark');
  localStorage.setItem('theme', isDark ? 'light' : 'dark');
  document.getElementById('themeBtn').textContent = isDark ? '\u{1F319}' : '☀️';
}
(function() {
  if (localStorage.getItem('theme') === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('themeBtn').textContent = '☀️';
    });
  }
})();

/* ===== Favorites ===== */
function getFavs() { try { return JSON.parse(localStorage.getItem('tscap_favs') || '[]'); } catch(e) { return []; } }
function saveFavs(f) { localStorage.setItem('tscap_favs', JSON.stringify(f)); }
function toggleFav(tab, icon, title) {
  var favs = getFavs();
  var idx = favs.findIndex(function(f) { return f.tab === tab; });
  if (idx >= 0) favs.splice(idx, 1);
  else favs.push({ tab: tab, icon: icon, title: title });
  saveFavs(favs);
}

  var panel = document.getElementById('favPanel');
  panel.classList.toggle('open');
  if (panel.classList.contains('open')) renderFavPanel();
}

/* ===== Search ===== */
function handleSearch(e) {
  var q = document.getElementById('searchInput').value.trim().toLowerCase();
  var el = document.getElementById('searchResults');
  if (!q) { el.classList.remove('open'); return; }
  var matches = [];
  var si = SITE_DATA.searchIndex;
  si.forEach(function(item) {
    var hay = (item.title + ' ' + item.keywords + ' ' + item.path).toLowerCase();
    if (hay.indexOf(q) !== -1) {
      var i = hay.indexOf(q), s = Math.max(0, i - 12);
      var raw = (item.title + ' ' + item.keywords + ' ' + item.path).substring(s, i + q.length + 25);
      var snip = raw.replace(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')','gi'),'<mark>$1</mark>');
      matches.push({ item: item, snippet: '...' + snip + '...' });
    }
  });
  if (matches.length === 0) {
    document.querySelectorAll('.tab-content').forEach(function(tab) {
      var tid = tab.id.replace('tab-',''), txt = tab.textContent.toLowerCase();
      if (txt.indexOf(q) !== -1) {
        var idx = txt.indexOf(q), sn = tab.textContent.substring(Math.max(0,idx-15), idx+q.length+25);
        sn = sn.replace(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')','gi'),'<mark>$1</mark>');
        var found = si.find(function(s) { return s.tab === tid; });
        if (found) matches.push({ item: found, snippet: '...' + sn + '...' });
      }
    });
  }
  if (matches.length === 0) {
    el.innerHTML = '<div class="search-no-result">「' + q + '」に一致する情報が見つかりませんでした</div>';
  } else {
    el.innerHTML = matches.map(function(m) {
      return '<a class="search-result-item" onclick="showTab(\'' + m.item.tab + '\');closeSearch();">' +
        '<span class="sr-icon">' + m.item.icon + '</span><div><div class="sr-title">' + m.item.title + '</div>' +
        '<div class="sr-path">' + m.item.path + '</div><div class="sr-snippet">' + m.snippet + '</div></div></a>';
    }).join('');
  }
  el.classList.add('open');
  if (e && e.key === 'Enter' && matches.length === 1) { showTab(matches[0].item.tab); closeSearch(); }
}
function closeSearch() { document.getElementById('searchResults').classList.remove('open'); document.getElementById('searchInput').value = ''; }
document.addEventListener('click', function(e) {
  var sr = document.getElementById('searchResults'), si = document.getElementById('searchInput');
  if (!sr.contains(e.target) && e.target !== si) sr.classList.remove('open');
  var fp = document.getElementById('favPanel'), fb = document.getElementById('favBtn');
  if (!fp.contains(e.target) && e.target !== fb) fp.classList.remove('open');
});

/* ===== FAQ Filter ===== */
function filterFaq() {
  var q = document.getElementById('faqSearch').value.trim().toLowerCase();
  document.querySelectorAll('#tab-faq .faq-item').forEach(function(item) {
    item.style.display = !q || item.textContent.toLowerCase().indexOf(q) !== -1 ? '' : 'none';
  });
}

/* ===== Helper: render article sections ===== */
function renderSections(sections) {
  var h = '';
  sections.forEach(function(s) {
    if (s.heading) h += '<h3' + (s.isHighlight ? ' class="highlight"' : '') + '>' + s.heading + '</h3>';
    if (s.subheading) h += '<h4>' + s.subheading + '</h4>';
    if (s.paragraphs) s.paragraphs.forEach(function(p) { h += '<p>' + p + '</p>'; });
    if (s.list) { h += '<ul>'; s.list.forEach(function(li) { h += '<li>' + li + '</li>'; }); h += '</ul>'; }
    if (s.orderedList) { h += '<ol>'; s.orderedList.forEach(function(li) { h += '<li>' + li + '</li>'; }); h += '</ol>'; }
    if (s.checklist) { h += '<ul class="checklist">'; s.checklist.forEach(function(li) { h += '<li>' + li + '</li>'; }); h += '</ul>'; }
    if (s.table) {
      h += '<div class="table-wrapper"><table class="data-table"><tr>';
      s.table.headers.forEach(function(th) { h += '<th>' + th + '</th>'; });
      h += '</tr>';
      s.table.rows.forEach(function(row) { h += '<tr>'; row.forEach(function(td) { h += '<td>' + td + '</td>'; }); h += '</tr>'; });
      h += '</table></div>';
    }
    if (s.info) h += '<div class="info-box"><p style="margin:0;">' + s.info + '</p></div>';
    if (s.warning) h += '<div class="info-box warning"><p class="highlight" style="margin:0;">' + s.warning + '</p></div>';
    if (s.subsections) s.subsections.forEach(function(sub) {
      if (sub.subheading) h += '<h4>' + sub.subheading + '</h4>';
      if (sub.paragraphs) sub.paragraphs.forEach(function(p) { h += '<p>' + p + '</p>'; });
      if (sub.list) { h += '<ul>'; sub.list.forEach(function(li) { h += '<li>' + li + '</li>'; }); h += '</ul>'; }
      if (sub.orderedList) { h += '<ol>'; sub.orderedList.forEach(function(li) { h += '<li>' + li + '</li>'; }); h += '</ol>'; }
      if (sub.checklist) { h += '<ul class="checklist">'; sub.checklist.forEach(function(li) { h += '<li>' + li + '</li>'; }); h += '</ul>'; }
    });
  });
  return h;
}
